<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Loading...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{--bg:#0e0d22;--panel:#17153a;--line:#2c2961;--fg:#eceaff;--mut:#a09dc8;--acc:#8b7dff;--sig:#ffb454;--hd:"Unbounded",sans-serif;--bd:"Manrope",sans-serif}
:root[data-theme=light]{--bg:#f6f5ff;--panel:#fff;--line:#dedaf5;--fg:#17143a;--mut:#5e5a86;--acc:#5b49f0;--sig:#c2570c}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.65 var(--bd)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.mut{color:var(--mut)}
nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:color-mix(in srgb,var(--bg) 75%,transparent);backdrop-filter:blur(12px)}
.brand{font:700 1rem var(--hd);text-decoration:none}
.nl{display:flex;gap:18px;align-items:center}
.nl a{text-decoration:none;color:var(--mut);font-size:.9rem}
.tb,.chip{font:500 .82rem var(--bd);padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer}
.tb:hover,.chip:hover{border-color:var(--acc);color:var(--fg)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.hero{min-height:75vh;display:flex;align-items:center;padding-top:80px}
h1{font:700 clamp(2.5rem,7vw,5rem)/1.05 var(--hd);margin:0 0 16px;letter-spacing:-.02em}
.role{font:700 clamp(1.1rem,2.5vw,1.5rem) var(--bd);color:var(--sig);margin:0 0 10px}
.tag{color:var(--mut);max-width:600px;margin:0 0 24px;font-size:1.1rem}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:700 .95rem var(--bd);padding:12px 24px;border-radius:12px;background:var(--acc);color:var(--bg);text-decoration:none;border:2px solid var(--acc);cursor:pointer}
.btn.alt{background:none;color:var(--fg);border-color:var(--line)}
.btn:hover{border-color:var(--sig)}
main section{padding:50px 0}
.glass{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:32px}
h2{font:700 clamp(1.4rem,3vw,2rem) var(--hd);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between}
.card h3{font:700 1.2rem var(--hd);margin:0 0 8px;color:var(--fg)}
.card .meta{font-size:.85rem;color:var(--sig);font-weight:700;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tg{font:500 .75rem var(--bd);padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tl{list-style:none;padding:0 0 0 20px;border-left:2px solid var(--line);margin:0}
.tl>li{position:relative;margin-bottom:24px}
.tl>li::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--acc)}
dialog{width:min(800px,92vw);padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dm{aspect-ratio:16/9;background:#000;position:relative}
.dm iframe, .dm img{width:100%;height:100%;object-fit:cover;border:0}
.gallery-thumbs{display:flex;gap:8px;padding:10px 20px;background:var(--bg);overflow-x:auto}
.gallery-thumbs img{width:60px;height:40px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--line);opacity:0.6;transition:.2s}
.gallery-thumbs img:hover, .gallery-thumbs img.active{opacity:1;border-color:var(--acc)}
.dp{padding:20px}
.x{position:absolute;right:12px;top:12px;z-index:5;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
footer{padding:40px 0;text-align:center;color:var(--mut);border-top:1px solid var(--line);margin-top:40px}
</style>
</head>
<body>
<nav>
  <a class="brand" href="#top" id="nm">Portfolio</a>
  <span class="nl">
    <a href="#work">Projects</a>
    <a href="#skills">Skills</a>
    <a href="#exp">Experience</a>
    <button class="tb" id="theme" type="button">Theme</button>
  </span>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <h1 id="name">...</h1>
    <p class="role" id="role"></p>
    <p class="tag" id="tag"></p>
    <div class="cta">
      <a class="btn" href="#work">View Projects</a>
      <a class="btn alt" id="email-btn" href="#">Contact Me</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="work">
    <h2>Featured Projects</h2>
    <div class="grid" id="projects-grid"></div>
  </section>

  <section id="skills">
    <div class="glass">
      <h2>Skills & Expertise</h2>
      <div class="grid" id="skills-grid"></div>
    </div>
  </section>

  <section id="exp">
    <div class="glass">
      <h2>Experience</h2>
      <ol class="tl" id="exp-list"></ol>
    </div>
  </section>
</main>

<footer>
  <p id="foot"></p>
</footer>

<dialog id="dlg">
  <button class="x" onclick="document.getElementById('dlg').close()">✕</button>
  <div id="dlg-body"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
let DATA = [];

fetch("projects.json")
  .then(r => r.json())
  .then(render)
  .catch(() => alert("Error loading projects.json"));

function render(d) {
  DATA = d.projects || [];
  const p = d.profile || {};
  document.title = p.name + " – " + p.title;
  $("#name").textContent = p.name;
  $("#nm").textContent = p.name;
  $("#role").textContent = p.title;
  $("#tag").textContent = p.tagline;
  if(p.email) $("#email-btn").href = "mailto:" + p.email;

  $("#projects-grid").innerHTML = DATA.map((x, i) => `
    <div class="card">
      <div>
        <h3>${x.title}</h3>
        <div class="meta">${x.company} • ${x.period}</div>
        <p class="mut" style="font-size:0.9rem">${x.summary}</p>
      </div>
      <div>
        <div class="chips">${(x.tech||[]).map(t => `<span class="tg">${t}</span>`).join('')}</div>
        <button class="btn alt" style="width:100%;margin-top:14px;padding:8px" onclick="openModal(${i})">View Details</button>
      </div>
    </div>
  `).join('');

  $("#skills-grid").innerHTML = (p.skills || []).map(g => `
    <div>
      <h3 style="font-size:1rem;color:var(--sig)">${g.group}</h3>
      <div class="chips">${(g.items||[]).map(i => `<span class="tg">${i}</span>`).join('')}</div>
    </div>
  `).join('');

  $("#exp-list").innerHTML = (d.experience || []).map(e => `
    <li>
      <strong>${e.role}</strong> - <span style="color:var(--sig)">${e.company}</span>
      <div class="mut" style="font-size:0.85rem">${e.period}</div>
      <ul style="margin:8px 0 0;padding-left:18px" class="mut">
        ${(e.points||[]).map(pt => `<li>${pt}</li>`).join('')}
      </ul>
    </li>
  `).join('');

  $("#foot").textContent = `© ${new Date().getFullYear()} ${p.name}`;
}

function openModal(i) {
  const x = DATA[i];
  
  let mediaHtml = '';
  let thumbsHtml = '';

  if (x.video) {
    mediaHtml = `<iframe id="main-media" src="https://www.youtube-nocookie.com/embed/${x.video}?autoplay=1" allowfullscreen></iframe>`;
  } else if (x.images && x.images.length > 0) {
    mediaHtml = `<img id="main-media" src="${x.images[0]}" alt="${x.title}">`;
  }

  if (x.images && x.images.length > 0) {
    thumbsHtml = `
      <div class="gallery-thumbs">
        ${x.video ? `<img src="https://img.youtube.com/vi/${x.video}/hqdefault.jpg" onclick="setMainMedia('video', '${x.video}', this)" class="active">` : ''}
        ${x.images.map((img, idx) => `<img src="${img}" onclick="setMainMedia('image', '${img}', this)" ${!x.video && idx === 0 ? 'class="active"' : ''}>`).join('')}
      </div>
    `;
  }

  $("#dlg-body").innerHTML = `
    <div class="dm" id="media-container">${mediaHtml}</div>
    ${thumbsHtml}
    <div class="dp">
      <h2>${x.title}</h2>
      <p class="mut">${x.summary}</p>
      <p style="margin-top:10px"><strong>Role:</strong> ${x.role}</p>
      <div class="chips" style="margin-top:10px">${(x.tech||[]).map(t => `<span class="tg">${t}</span>`).join('')}</div>
    </div>
  `;
  $("#dlg").showModal();
}

function setMainMedia(type, source, el) {
  const container = $("#media-container");
  if (type === 'video') {
    container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${source}?autoplay=1" allowfullscreen></iframe>`;
  } else {
    container.innerHTML = `<img src="${source}" alt="Project image">`;
  }
  document.querySelectorAll('.gallery-thumbs img').forEach(img => img.classList.remove('active'));
  el.classList.add('active');
}

$("#theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  localStorage.setItem("theme", t);
};
</script>
</body>
</html>
